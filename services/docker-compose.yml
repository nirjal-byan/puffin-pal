name: puffinpal

services:
  postgres:
    image: postgres:16-alpine
    container_name: puffinpal-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-puffinpal_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-puffinpal_password}
      POSTGRES_DB: ${POSTGRES_DB:-puffinpal_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:6.1.1
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8080:8080"

  redis:
    image: redis:7-alpine
    container_name: puffinpal-redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-puffinpal_redis_password}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    container_name: puffinpal-seaweedfs
    restart: always
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    command: "server -s3 -s3.config=/etc/seaweedfs/s3.json"
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs_data:/data

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
